[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankii"
version = "0.6.1"
description = "Review and import language-learning material into Anki"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
ai = ["openai>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ankii = "ankii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
